name: PR commands

on:
  workflow_call:
    inputs:
      commands:
        description: "One command per line, as `trigger: script`. A line for 🎨 replaces the built-in formatter."
        type: string
        default: ""
      node-version:
        description: "The Node.js version to install. Empty keeps the runner's own."
        type: string
        default: ""
      php-version:
        description: "The PHP version to install. Empty keeps the runner's own."
        type: string
        default: ""

jobs:
  run:
    # GitHub evaluates this before starting a machine. A comment that is exactly a
    # trigger gets one, and so does any comment from someone with write access,
    # because expressions can't split a trigger from its arguments. The first step
    # stops the run unless the comment's first word is a trigger.
    if: >-
      github.event_name == 'issue_comment'
      && github.event.issue.pull_request
      && (
        contains(format('🎨 {0}', inputs.commands), github.event.comment.body)
        || contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency: pr-commands-${{ github.event.issue.number }}-${{ github.event.comment.body }}
    steps:
      # Matches the comment against the triggers, then checks that the commenter
      # has write access and that the pull request isn't from a fork. Anything else
      # ends the run here, without a reaction or a reply.
      - id: resolve
        env:
          ACTOR: ${{ github.event.comment.user.login }}
          BODY: ${{ github.event.comment.body }}
          COMMANDS: ${{ inputs.commands }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number }}
        run: |
          trim() {
            local text="$1"
            text="${text#"${text%%[![:space:]]*}"}"
            printf '%s' "${text%"${text##*[![:space:]]}"}"
          }

          body="$(trim "$BODY")"
          trigger="${body%%[[:space:]]*}"
          args="$(trim "${body#"$trigger"}")"
          script=""

          if [ "$trigger" = "🎨" ]; then
            script="format"
          fi

          while IFS= read -r line; do
            if [[ "$line" != *:* ]]; then
              continue
            fi

            if [ "$(trim "${line%%:*}")" = "$trigger" ]; then
              script="$(trim "${line#*:}")"
            fi
          done <<< "$COMMANDS"

          if [ -z "$script" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          permission="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" --jq .permission || echo none)"

          if [ "$permission" != "admin" ] && [ "$permission" != "write" ]; then
            echo "$ACTOR has $permission access, so the command doesn't run."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          fork="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.head.repo.full_name != .base.repo.full_name' || echo true)"

          if [ "$fork" = "true" ]; then
            echo "The pull request comes from a fork, so the command doesn't run."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "found=true"
            echo "trigger=$trigger"
            echo "args<<PR_BOT_ARGS"
            echo "$args"
            echo "PR_BOT_ARGS"
            echo "script<<PR_BOT_SCRIPT"
            echo "$script"
            echo "PR_BOT_SCRIPT"
          } >> "$GITHUB_OUTPUT"

      # Reacts with 👀, then 👍 or 👎 when the job ends. Its own checks repeat the
      # ones above, so the replies it posts when it refuses never appear.
      - id: command
        if: steps.resolve.outputs.found == 'true'
        uses: github/command@v2.0.3
        with:
          command: ${{ steps.resolve.outputs.trigger }}
          # Defaults to false, which ignores the command on draft pull requests.
          allow_drafts: true
          # Defaults to false, which waits for the pull request's checks to pass. A
          # pull request whose style check fails then never qualifies for the fix.
          skip_ci: true
          # Defaults to false, which waits for approving reviews. Formatting needs none.
          skip_reviews: true
          # allow_forks stays false: GITHUB_TOKEN can't push to a fork, and running a
          # stranger's code with a token that can push isn't safe.

      - if: steps.command.outputs.continue == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.command.outputs.ref }}

      - if: steps.command.outputs.continue == 'true' && inputs.php-version != ''
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          coverage: none

      - if: steps.command.outputs.continue == 'true' && inputs.node-version != ''
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}

      # The script runs the pull request's code with a token that can push, so the
      # built-in formatter installs with scripts off.
      - if: steps.command.outputs.continue == 'true'
        env:
          ACTOR: ${{ steps.command.outputs.actor }}
          ARGS: ${{ steps.resolve.outputs.args }}
          COMMAND: ${{ steps.resolve.outputs.trigger }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.command.outputs.issue_number }}
          SCRIPT: ${{ steps.resolve.outputs.script }}
        run: |
          set -o pipefail

          format() {
            local ran=false

            if [ -f composer.json ] && grep -q '"laravel/pint"' composer.json; then
              composer install --no-scripts --no-interaction --prefer-dist
              vendor/bin/pint
              ran=true
            fi

            if [ -f package.json ] && grep -q '"prettier"' package.json; then
              if [ -f pnpm-lock.yaml ]; then
                corepack enable
                pnpm install --frozen-lockfile --ignore-scripts
                pnpm exec prettier --write .
              else
                npm ci --ignore-scripts
                npx prettier --write .
              fi

              ran=true
            fi

            if [ "$ran" = false ]; then
              echo "Found neither laravel/pint in composer.json nor prettier in package.json."
              return 1
            fi
          }

          export -f format

          # The words after the trigger become $1, $2 and so on. read doesn't expand
          # * or ? into file names, so a comment can't pull in the repo's files.
          read -ra words <<< "$ARGS"
          bash -eo pipefail -c "$SCRIPT" pr-bot "${words[@]}" 2>&1 | tee "$RUNNER_TEMP/output.log"

      # GITHUB_TOKEN may not push changes to workflow files, which Prettier formats.
      - if: steps.command.outputs.continue == 'true'
        run: git checkout -- .github/workflows 2>/dev/null || true

      - if: steps.command.outputs.continue == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Apply ${{ steps.resolve.outputs.trigger }} fixes

      - if: failure() && steps.command.outputs.continue == 'true'
        env:
          ACTOR: ${{ steps.command.outputs.actor }}
          ARGS: ${{ steps.resolve.outputs.args }}
          COMMAND: ${{ steps.resolve.outputs.trigger }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.command.outputs.issue_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          log="$RUNNER_TEMP/output.log"
          reply="$RUNNER_TEMP/reply.md"
          shown=100
          comment="$(printf '%s %s' "$COMMAND" "$ARGS" | tr -d '`' | sed 's/ *$//')"

          echo "@$ACTOR \`$comment\` failed. [See the run]($RUN_URL) for details." > "$reply"

          if [ -s "$log" ]; then
            total="$(wc -l < "$log" | tr -d ' ')"
            summary="Output"
            fence='```'

            if [ "$total" -gt "$shown" ]; then
              summary="Output, last $shown of $total lines"
            fi

            while grep -qF "$fence" "$log"; do
              fence="$fence\`"
            done

            {
              printf '\n<details>\n<summary>%s</summary>\n\n%s\n' "$summary" "$fence"
              tail -n "$shown" "$log"

              if [ -n "$(tail -c 1 "$log")" ]; then
                echo
              fi

              printf '%s\n\n</details>\n' "$fence"
            } >> "$reply"
          fi

          gh pr comment "$PR" --body-file "$reply"
